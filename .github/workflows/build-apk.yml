name: Build APK

# Builds an installable debug APK on every push to main and on version tags.
# On tags like v1.0, the APK is attached to a GitHub Release automatically.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk autoscribe-android-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscribe-android-v1
          path: autoscribe-android-v1.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: autoscribe-android-v1.apk
          generate_release_notes: true
